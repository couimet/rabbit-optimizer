name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    uses: couimet/github-actions/.github/workflows/typescript-ci-checks.yml@main
    permissions:
      contents: read
      pull-requests: write
    with:
      pre-install-command: 'cp .env.ci .env'
      build-artifact-paths: ''
      test-command: 'pnpm ci:test'

  markdownlint:
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: couimet/github-actions/markdownlint@main

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: couimet/github-actions/shellcheck@main

  check-types-no-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash scripts/check-types-no-runtime.sh

  check-generated-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: couimet/github-actions/setup-node-pnpm@main
      - run: cp .env.ci .env
      - uses: couimet/github-actions/install-deps@main
      - uses: couimet/github-actions/check-generated-drift@main
        with:
          command: 'pnpm ci:check-generated-drift'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: couimet/github-actions/setup-node-pnpm@main
      - run: cp .env.ci .env
      - uses: couimet/github-actions/install-deps@main
      - run: pnpm ci:test:integration

  validate-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: couimet/github-actions/setup-node-pnpm@main
      - run: cp .env.ci .env
      - uses: couimet/github-actions/install-deps@main
      - run: bash scripts/validate-migrations.sh

  bats-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: couimet/github-actions/bats-test@main
        with:
          test-directory: bats-tests
          github-token: ${{ secrets.GITHUB_TOKEN }}
